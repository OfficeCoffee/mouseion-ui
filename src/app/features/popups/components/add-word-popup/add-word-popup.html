<div class="card">
    <div class="popup-header">
        <button class="close-btn" type="button" aria-label="Close">X</button>
        <button class="save-btn" type="button" aria-label="Add Word">Add</button>
    </div>
    
    <div class="content">
        <div class="row">
            <div class="field">
                <span>Word</span>
                <input type="text" aria-label="Insert word input box" placeholder="Input text :D!" />
            </div>
            <div class="field">
                <span>Origin</span>
                <input type="text" aria-label="Insert origin input box" placeholder="Input text :D!" />
            </div>
        </div>
        <div class="field wide">
            <span>Definition</span>
            <textarea placeholder="Test" [disabled]="true"></textarea>
        </div>
    </div>
</div>
