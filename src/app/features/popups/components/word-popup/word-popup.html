<div class="card">
    <div class="popup-header">
        <button class="close-btn" type="button" aria-label="Close" (click)="close()">X</button>
        @switch (mode()) {
            @case ('add') {
                <button class="popup-state-btn" type="button" aria-label="Add Word" (click)="add()" [disabled]="form.invalid">Add</button>
            }
            @case ('view') {
                <button class="popup-state-btn" type="button" aria-label="Edit Word" (click)="setMode('update')" >Edit</button>
            }
            @case ('update') {
                <button class="popup-state-btn" type="button" aria-label="Save Word" (click)="update()" [disabled]="form.invalid">Save</button>
            }
        }
    </div>
    
    <div class="content">
        <div class="row">
            <div class="field">
                <span>Word</span>
                <input 
                    type="text"
                    aria-label="Insert word"
                    placeholder="Input Word"
                    formControlName="word"
                />
            </div>
            <div class="field">
                <span>Origin</span>
                <input 
                    type="text"
                    aria-label="Insert origin"
                    placeholder="Input Origin"
                    formControlName="word"
                />
            </div>
        </div>
        <div class="field wide">
            <span>Definition</span>
            <textarea 
                placeholder="Input Definition"
                formControlName="word"
            ></textarea>
        </div>
    </div>
</div>
