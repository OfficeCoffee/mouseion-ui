<input
    type="text"
    [value]="rawWord()"
    (input)="onWordInput($event)"
    placeholder="New Word"
>

<button type="button" (click)="onAddWord()">
    Add Word
</button>

<p>Mock words loaded: {{ mockWords().length }}</p>
<section class="word-list">
    @if (mockWords().length > 0) {
        <p> You got some cool words there </p>
        <ul>
            @for (word of mockWords(); track word.wordId) {
                <app-word-card [word]="word" />
            } 
        </ul>
    } @else {
        <p> Alas, we are currently facing a state of absolute depletion.</p>
    }
</section>
