<div class="card">
    <div class="popup-header">
        <button class="close-btn" type="button" aria-label="Close">X</button>
        @switch (mode()) {
            @case ('add') {
                <button class="popup-state-btn" type="button" aria-label="Add Word">Add</button>
            }
            @case ('view') {
                <button class="popup-state-btn" type="button" aria-label="Add Word">Edit</button>
            }
            @case ('update') {
                <<button class="popup-state-btn" type="button" aria-label="Add Word">Save</button>
            }
        }
    </div>
    
    <div class="content">
        <div class="row">
            <div class="field">
                <span>Word</span>
                <input 
                    type="text"
                    aria-label="Insert word"
                    placeholder="Input Word"
                    [ngModel]="word()"
                    (ngModelChange)="word.set($event)"
                    [disabled]="disabled()"
                />
            </div>
            <div class="field">
                <span>Origin</span>
                <input 
                    type="text"
                    aria-label="Insert origin"
                    placeholder="Input Origin"
                    [ngModel]="origin()"
                    (ngModelChange)="origin.set($event)"
                    [disabled]="disabled()"
                />
            </div>
        </div>
        <div class="field wide">
            <span>Definition</span>
            <textarea 
                placeholder="Input Definition"
                [ngModel]="definition()"
                (ngModelChange)="definition.set($event)"
                [disabled]="disabled()"
            ></textarea>
        </div>
    </div>
</div>
