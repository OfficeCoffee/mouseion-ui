<div class="table-container">

    <div class="view-all-container">
        <a href="http://localhost:4200/view-words-page">
            <button class="view-all-button">
                View All Words
            </button>
        </a>
    </div>

    <div class="words-list-container">
        @for (word of wordSignal(); track $index){
            <div class="word-row">
                <div class="word-column">
                    <p> {{ word.word ?? 'Untitled'}} </p>
                </div>

                <div class="definition-column">
                    <p> {{ word.definition ?? 'No definition'}} </p>
                </div>

                <div class="origin-column">
                    <p> {{ word.origin ?? 'No origin'}} </p>
                </div>

                <button class="edit-button">
                    +
                </button>
            </div>
        }
    </div> 

    <div class="add-word-container">
        <button class="add-word-button">
            Add Word
        </button>
    </div>
    
</div>
